
plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "com.facebook.react"
}

android {
    namespace "com.nexashare.app"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.nexashare.app"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    packaging {
        resources {
            excludes.addAll([
                "META-INF/LICENSE.md",
                "META-INF/NOTICE.md",
                "META-INF/LICENSE",
                "META-INF/NOTICE",
                "META-INF/versions/9/OSGI-INF/MANIFEST.MF"
            ])
        }
    }
}

dependencies {
    implementation "com.facebook.react:react-android"

    // Hermes is required because hermesEnabled=true
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation("io.github.react-native-community:jsc-android:2026004.+")
    }

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "org.json:json:20260814"
    implementation "org.bouncycastle:bcpkix-jdk18on:1.86"
    implementation "org.bouncycastle:bcprov-jdk18on:1.86"
}

react {
    // React Native application root
    root = file("../..")

    // Dependencies are installed in the repository root node_modules
    reactNativeDir = file("../../../../node_modules/react-native")
    codegenDir = file("../../../../node_modules/@react-native/codegen")
    cliFile = file("../../../../node_modules/react-native/cli.js")

    autolinkLibrariesWithApp()
}
