appId: com.nexashare.desktop
productName: NexaShare
directories:
  output: out/make
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
win:
  target:
    - nsis
    - dir
  artifactName: "${productName}-Setup-${version}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
asar: true
electronVersion: 38.2.1
publish: null
